<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>申论AI批改 Demo V1</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 980px; }
    h1 { margin-bottom: 8px; }
    textarea { width: 100%; min-height: 120px; margin: 8px 0 16px; }
    input[type="text"] { width: 100%; padding: 8px; margin: 8px 0 16px; }
    button { padding: 10px 18px; cursor: pointer; }
    pre { background: #f7f7f7; padding: 12px; overflow: auto; }
    .row { margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>申论AI批改 Demo V1</h1>
  <p>输入试卷、参考答案和考生答案，点击“开始批改”。</p>

  <div class="row">
    <label>评分标准（可选）</label>
    <input id="score_standard" type="text" value="省考标准" />
  </div>

  <div class="row">
    <label>申论试卷</label>
    <textarea id="question_paper" placeholder="粘贴题目内容..."></textarea>
  </div>

  <div class="row">
    <label>参考答案</label>
    <textarea id="reference_answer" placeholder="粘贴参考答案..."></textarea>
  </div>

  <div class="row">
    <label>考生答案</label>
    <textarea id="candidate_answer" placeholder="粘贴考生答案..."></textarea>
  </div>

  <button id="submit">开始批改</button>

  <h3>结构化结果（parsed）</h3>
  <pre id="parsed">尚未批改</pre>

  <h3>模型原始输出（raw_model_output）</h3>
  <pre id="raw"></pre>

  <script>
    const submitBtn = document.getElementById('submit');
    const parsedEl = document.getElementById('parsed');
    const rawEl = document.getElementById('raw');

    submitBtn.onclick = async () => {
      submitBtn.disabled = true;
      submitBtn.innerText = '批改中...';
      parsedEl.textContent = '请求中...';
      rawEl.textContent = '';

      const payload = {
        score_standard: document.getElementById('score_standard').value,
        question_paper: document.getElementById('question_paper').value,
        reference_answer: document.getElementById('reference_answer').value,
        candidate_answer: document.getElementById('candidate_answer').value,
      };

      try {
        const resp = await fetch('/review', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (!resp.ok) {
          parsedEl.textContent = '请求失败：' + JSON.stringify(data, null, 2);
        } else {
          parsedEl.textContent = JSON.stringify(data.parsed, null, 2);
          rawEl.textContent = data.raw_model_output || '';
        }
      } catch (e) {
        parsedEl.textContent = '请求异常：' + e;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '开始批改';
      }
    };
  </script>
</body>
</html>
